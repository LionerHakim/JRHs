<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>404 — JRH</title>
  <style>
    :root {
      --ink: #111111;
      --white: #ffffff;
      --mist: #e9eaeb;
      --cream: #f3efeb;
      --warm: #615e5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--white);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    section {
      width: min(720px, 100%);
      padding: 56px;
      border-radius: 32px;
      background: var(--cream);
    }
    small {
      display: block;
      margin-bottom: 16px;
      color: var(--warm);
      font: 500 13px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(48px, 12vw, 96px);
      line-height: 1;
      letter-spacing: -.03em;
      font-weight: 500;
    }
    p {
      max-width: 560px;
      margin: 20px 0 28px;
      color: var(--warm);
      font-size: 18px;
      line-height: 1.5;
    }
    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-radius: 160px;
      background: var(--ink);
      color: var(--white);
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { background: #1e1e1d; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    @media (max-width: 720px) {
      main { padding: 14px; }
      section { padding: 32px; }
    }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="title">
      <small>JRH / Page not found</small>
      <h1 id="title">404</h1>
      <p>Halaman yang kamu cari tidak tersedia atau sudah dipindahkan.</p>
      <a href="/">Kembali ke JRH</a>
    </section>
  </main>
</body>
</html>
