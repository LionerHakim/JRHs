<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="color-scheme" content="light" />
  <title>404 — JRH</title>
  <style>
    :root{--red:#b00020;--yellow:#ffc400;--black:#080808;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;min-height:100vh;background:var(--black);color:var(--white);font-family:Inter,system-ui,sans-serif}
    main{min-height:100svh;display:grid;place-items:center;padding:24px}
    section{width:min(820px,100%);padding:clamp(32px,7vw,72px);border:3px solid var(--white);border-top:12px solid var(--red);background:var(--black)}
    small{display:block;margin-bottom:18px;color:var(--yellow);font:800 11px/1.2 monospace;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:0;color:var(--white);font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:clamp(88px,20vw,180px);line-height:.8;letter-spacing:-.05em}
    p{max-width:560px;margin:28px 0;color:var(--white);font-size:18px;line-height:1.5}
    a{min-height:50px;display:inline-flex;align-items:center;padding:0 24px;border-radius:9999px;background:var(--red);color:var(--white);font-weight:800;text-transform:uppercase;text-decoration:none}
    a:hover{background:var(--yellow);color:var(--black)}
    a:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="title">
      <small>JRH / Page not found</small>
      <h1 id="title">404</h1>
      <p>Halaman yang kamu cari tidak tersedia atau sudah dipindahkan.</p>
      <a href="/">Kembali ke JRH</a>
    </section>
  </main>
</body>
</html>
