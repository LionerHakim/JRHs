  <style>
    :root { color-scheme: dark; background: #08090b; }
    html, body { min-height: 100%; background: #08090b; }
    body { margin: 0; }
    #root { min-height: 100vh; }
    .jrh-boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #fff;
      background: #08090b;
      font: 600 14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      letter-spacing: .02em;
      text-align: center;
    }
    .jrh-boot small {
      display: block;
      margin-top: 8px;
      color: #9ca4b0;
      font-weight: 500;
    }
  </style>
  <script>
    (() => {
      const showBootFailure = () => {
        const root = document.getElementById('root')
        if (!root || root.dataset.jrhMounted === 'true') return
        root.innerHTML = '<div class="jrh-boot" role="alert"><div>JRH<small>Halaman gagal dimuat. Silakan muat ulang halaman.</small></div></div>'
      }

      window.addEventListener('error', (event) => {
        if (event instanceof ErrorEvent) showBootFailure()
      })

      window.addEventListener('unhandledrejection', showBootFailure)

      window.setTimeout(() => {
        const root = document.getElementById('root')
        if (root && root.dataset.jrhMounted !== 'true') showBootFailure()
      }, 8000)
    })()
  </script>

<body>
  <div id="root">
    <div class="jrh-boot" role="status" aria-live="polite">
      <div>
        JRH
        <small>Memuat halaman…</small>
      </div>
    </div>
  </div>
  <noscript>
